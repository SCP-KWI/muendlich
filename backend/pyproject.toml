[project]
name = "muendlich-backend"
version = "0.1.0"
description = "muendlich backend — capture and structure post-lesson observations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "rapidfuzz>=3.9",
    "anthropic>=0.40",
    "httpx>=0.27",            # timeout configuration for the Anthropic client
    "reportlab>=4.2",
    "spacy>=3.7",             # anonymizer: German NER (de_core_news_md)
    "psycopg[binary]>=3.1",   # PostgreSQL driver (prod). Not needed for the sqlite dev/smoke path.
]

# These ranges are the abstract declaration. The container installs from
# requirements.lock (hash-pinned) so image builds are reproducible — see
# Dockerfile and the regeneration command in README.md.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.ai", "app.routers"]

[tool.setuptools.package-data]
"app.ai" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "E501",   # long lines are tolerated; the formatter owns wrapping
    "B008",   # Depends() in a default is the documented FastAPI idiom
    "S104",   # binding 0.0.0.0 inside a container is intentional
    "UP042",  # (str, Enum) is deliberate: SQLAlchemy stores the value, and
              # StrEnum would change the .value/str() semantics the ORM relies on
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E402"]    # asserts + test credentials
"scripts/**" = ["S101"]                          # manual smoke scripts
"app/seed.py" = ["S105", "S106"]                 # dev-only demo password
"app/schemas.py" = ["S105"]                      # "bearer" is a token *type*, not a secret
"app/demo.py" = ["S105"]                         # a deliberately unusable hash, not a password
# Alembic owns the style of its generated files; don't fight the template.
"alembic/**" = ["UP007", "UP035", "E402"]
