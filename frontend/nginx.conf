# Serves the built PWA and proxies /api to the backend container. This is the
# only container NGINX Proxy Manager talks to; NPM handles TLS + the subdomain.
#
# NOTE: listens on 8080, not 80 — the image now runs as an unprivileged user and
# cannot bind a privileged port. Point the NPM proxy host at muendlich-web:8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Bound the request body: the largest legitimate payload is a dictation
    # (capped at 8 KB by the API schema) or a commit batch.
    client_max_body_size 256k;

    # ---- security headers ----
    # Repeated in the locations below, because add_header in a server block is
    # discarded by any location that sets headers of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
    # script-src is a strict 'self': the theme bootstrap moved out of an inline
    # <script> into /theme.js, so no nonce or 'unsafe-inline' is required.
    # style-src keeps 'unsafe-inline' for React's style={{...}} attributes — those
    # cannot execute script, so the residual risk is cosmetic.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    # API → FastAPI backend (same Docker network). The /api prefix is preserved.
    location /api/ {
        proxy_pass http://muendlich-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The structurer call can take ~30 s (STRUCTURER_TIMEOUT_S) plus retries.
        # Allow a little more than the backend's worst case so its typed 504 wins
        # over an nginx-generated one.
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Responses carry pupil data — never cache. Re-assert the headers this
        # location's own add_header would otherwise drop.
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Correct MIME type for the PWA manifest (nginx default would be wrong).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Content-hashed build output: safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The service worker must never be served stale, or clients pin an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The teacher handbook, reachable without a login. An exact-match location
    # so the SPA fallback below doesn't swallow it and hand back index.html.
    location = /handbuch {
        try_files /handbuch.html =404;

        # One self-contained file: inline <style>, with its fonts and
        # screenshots embedded as data: URIs. The app-wide policy has
        # font-src 'self', which would silently drop the handbook's typography,
        # so this route gets a policy of its own — and a tighter one, since the
        # page loads no scripts at all. Note that any add_header here discards
        # every server-level one, so they are all restated.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Static files, with SPA fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
